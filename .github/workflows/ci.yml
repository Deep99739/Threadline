name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Validate external contracts
        run: python scripts/validate_contracts.py

      - name: Test invariants
        run: python -m pytest

      - name: Verify repository foundation
        run: python scripts/check_foundation.py

      - name: Verify clean-clone onboarding
        run: python scripts/verify_clean_clone.py
