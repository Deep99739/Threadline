name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: threadline
          POSTGRES_USER: threadline
          POSTGRES_PASSWORD: threadline_local
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U threadline -d threadline"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          npm --prefix apps/web ci

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Validate external contracts
        run: python scripts/validate_contracts.py

      - name: Test invariants
        run: python -m pytest

      - name: Verify PostgreSQL migrations and isolation
        run: python scripts/verify_postgres.py

      - name: Verify repository foundation
        run: python scripts/check_foundation.py

      - name: Verify clean-clone onboarding
        run: python scripts/verify_clean_clone.py

      - name: Verify public website
        run: |
          npm --prefix apps/web audit --omit=dev
          npm --prefix apps/web run lint
          npm --prefix apps/web test
